<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Style Transfer Platform</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Neural Style Transfer</h1>
            <p>Transform your photos into stunning artworks.</p>
        </header>

        <main>
            <div class="upload-section">
                <div class="upload-box" id="content-upload">
                    <h3>Content Image</h3>
                    <input type="file" id="content-image" accept="image/*">
                    <div class="preview" id="content-preview"></div>
                </div>
                <div class="upload-box" id="style-upload">
                    <h3>Style Image</h3>
                    <input type="file" id="style-image" accept="image/*">
                    <div class="preview" id="style-preview"></div>
                </div>
            </div>

            <div class="controls-section">
                <div class="control-row">
                    <div class="control-group">
                        <label for="alpha">Content Weight (&alpha;)</label>
                        <input type="range" id="alpha" min="1" max="100" value="10">
                        <span id="alpha-val">10</span>
                    </div>
                    <div class="control-group">
                        <label for="beta">Style Weight (&beta;)</label>
                        <input type="range" id="beta" min="1000" max="1000000000" value="100000000" step="100000">
                        <span id="beta-val">100000000</span>
                    </div>
                </div>
                <div class="control-row">
                    <div class="control-group">
                        <label for="num-steps">Total Epochs</label>
                        <input type="number" id="num-steps" value="2500" min="100" max="5000" step="100">
                    </div>
                    <div class="control-group">
                        <label for="intermediate-frames">Live Previews</label>
                        <select id="intermediate-frames">
                            <option value="0">0 (Fastest, no preview)</option>
                            <option value="1">1 update</option>
                            <option value="2">2 updates</option>
                            <option value="3">3 updates</option>
                            <option value="4" selected>4 updates (Best)</option>
                        </select>
                    </div>
                </div>
                </div>
                <button id="stylize-btn">Start Neural Style Transfer</button>
            </div>

            <div class="output-section">
                <h2>Result</h2>
                <div class="progress-container" id="progress-container" style="display:none;">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progress-fill"></div>
                    </div>
                    <p class="progress-text" id="progress-text">Epoch 0 / 2500</p>
                </div>
                <div class="loader" id="loader" style="display:none;">Initializing Model...</div>
                <div class="result-grid" id="result-grid">
                    <!-- Dynamic images will be added here -->
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
